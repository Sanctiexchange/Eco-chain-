<text x="18" y="26" fill="#121916" font-size="15" font-weight="700">ROFL</text><text x="72" y="26" fill="#68746e" font-size="12.5">height 2472 &#183; difficulty 3,000 &#183; 3000 puzzles per block</text><rect x="18" y="44" width="148" height="76" rx="4" fill="#ffffff" stroke="#d5dbd2" stroke-width="1"/><text x="29" y="65" fill="#8a5f10" font-size="13" font-weight="700">#2467</text><text x="29" y="81" fill="#121916" font-size="10">1e2951000f0797d7&#8230;</text><text x="29" y="96" fill="#1c5b52" font-size="10.5">@hbzhong</text><text x="29" y="110" fill="#68746e" font-size="9">小数点后的小快乐，也要认真收集。</text><line x1="166" y1="82.0" x2="192" y2="82.0" stroke="#b3bcb4" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="192" y="44" width="148" height="76" rx="4" fill="#ffffff" stroke="#d5dbd2" stroke-width="1"/><text x="203" y="65" fill="#8a5f10" font-size="13" font-weight="700">#2468</text><text x="203" y="81" fill="#121916" font-size="10">026e691d383cf9df&#8230;</text><text x="203" y="96" fill="#1c5b52" font-size="10.5">@hbzhong</text><text x="203" y="110" fill="#68746e" font-size="9">不是所有等待，都能靠刷新解决。</text><line x1="340" y1="82.0" x2="366" y2="82.0" stroke="#b3bcb4" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="366" y="44" width="148" height="76" rx="4" fill="#ffffff" stroke="#d5dbd2" stroke-width="1"/><text x="377" y="65" fill="#8a5f10" font-size="13" font-weight="700">#2469</text><text x="377" y="81" fill="#121916" font-size="10">b069c5328a2e266d&#8230;</text><text x="377" y="96" fill="#1c5b52" font-size="10.5">@hbzhong</text><text x="377" y="110" fill="#68746e" font-size="9">别眨眼，下一题已经安排上了。</text><line x1="514" y1="82.0" x2="540" y2="82.0" stroke="#b3bcb4" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="540" y="44" width="148" height="76" rx="4" fill="#ffffff" stroke="#d5dbd2" stroke-width="1"/><text x="551" y="65" fill="#8a5f10" font-size="13" font-weight="700">#2470</text><text x="551" y="81" fill="#121916" font-size="10">3da70ed7ba185ab9&#8230;</text><text x="551" y="96" fill="#1c5b52" font-size="10.5">@hbzhong</text><text x="551" y="110" fill="#68746e" font-size="9">我和显卡，一人负责一半梦想。</text><line x1="688" y1="82.0" x2="714" y2="82.0" stroke="#b3bcb4" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="714" y="44" width="148" height="76" rx="4" fill="#ffffff" stroke="#d5dbd2" stroke-width="1"/><text x="725" y="65" fill="#8a5f10" font-size="13" font-weight="700">#2471</text><text x="725" y="81" fill="#121916" font-size="10">8ed01bc9aba8921b&#8230;</text><text x="725" y="96" fill="#1c5b52" font-size="10.5">@hbzhong</text><text x="725" y="110" fill="#68746e" font-size="9">今天也想被主链翻牌子。</text><line x1="862" y1="82.0" x2="888" y2="82.0" stroke="#b3bcb4" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="888" y="44" width="148" height="76" rx="4" fill="#ffffff" stroke="#d5dbd2" stroke-width="1"/><text x="899" y="65" fill="#8a5f10" font-size="13" font-weight="700">#2472</text><text x="899" y="81" fill="#121916" font-size="10">882dd374658f2310&#8230;</text><text x="899" y="96" fill="#1c5b52" font-size="10.5">@hbzhong</text><text x="899" y="110" fill="#68746e" font-size="9">嘴上说佛系，后台算得飞起。</text></svg>
