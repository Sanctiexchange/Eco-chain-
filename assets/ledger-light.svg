" y="96" fill="#1c5b52" font-size="10.5">@hbzhong</text><text x="551" y="110" fill="#68746e" font-size="9">情绪不用满仓，给快乐留点位置。</text><line x1="688" y1="82.0" x2="714" y2="82.0" stroke="#b3bcb4" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="714" y="44" width="148" height="76" rx="4" fill="#ffffff" stroke="#d5dbd2" stroke-width="1"/><text x="725" y="65" fill="#8a5f10" font-size="13" font-weight="700">#2864</text><text x="725" y="81" fill="#121916" font-size="10">1e93d82ab176c5d5&#8230;</text><text x="725" y="96" fill="#1c5b52" font-size="10.5">@hbzhong</text><text x="725" y="110" fill="#68746e" font-size="9">账户可以复盘，夕阳记得现场看。</text><line x1="862" y1="82.0" x2="888" y2="82.0" stroke="#b3bcb4" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="888" y="44" width="148" height="76" rx="4" fill="#ffffff" stroke="#d5dbd2" stroke-width="1"/><text x="899" y="65" fill="#8a5f10" font-size="13" font-weight="700">#2865</text><text x="899" y="81" fill="#121916" font-size="10">0bf10bdb2bb3df16&#8230;</text><text x="899" y="96" fill="#1c5b52" font-size="10.5">@b81913221-ai</text><text x="899" y="110" fill="#68746e" font-size="9">gm</text></svg>
