ill="#1c5b52" font-size="10.5">@ywltby</text><text x="551" y="110" fill="#68746e" font-size="9">以前说拿了世界冠军就不骂我了，</text><line x1="688" y1="82.0" x2="714" y2="82.0" stroke="#b3bcb4" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="714" y="44" width="148" height="76" rx="4" fill="#ffffff" stroke="#d5dbd2" stroke-width="1"/><text x="725" y="65" fill="#8a5f10" font-size="13" font-weight="700">#2796</text><text x="725" y="81" fill="#121916" font-size="10">69aa2c9e2638a016&#8230;</text><text x="725" y="96" fill="#1c5b52" font-size="10.5">@ywltby</text><text x="725" y="110" fill="#68746e" font-size="9">输你一场，不代表我们会一直输给你。</text><line x1="862" y1="82.0" x2="888" y2="82.0" stroke="#b3bcb4" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="888" y="44" width="148" height="76" rx="4" fill="#ffffff" stroke="#d5dbd2" stroke-width="1"/><text x="899" y="65" fill="#8a5f10" font-size="13" font-weight="700">#2797</text><text x="899" y="81" fill="#121916" font-size="10">143931d10bd25b0e&#8230;</text><text x="899" y="96" fill="#1c5b52" font-size="10.5">@hbzhong</text><text x="899" y="110" fill="#68746e" font-size="9">显卡说它还能再做一套卷子。</text></svg>
