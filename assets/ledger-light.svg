="#1c5b52" font-size="10.5">@Aitensa</text><text x="551" y="110" fill="#68746e" font-size="9">gm from Aitensa</text><line x1="688" y1="82.0" x2="714" y2="82.0" stroke="#b3bcb4" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="714" y="44" width="148" height="76" rx="4" fill="#ffffff" stroke="#d5dbd2" stroke-width="1"/><text x="725" y="65" fill="#8a5f10" font-size="13" font-weight="700">#2611</text><text x="725" y="81" fill="#121916" font-size="10">997a915a07ad6c44&#8230;</text><text x="725" y="96" fill="#1c5b52" font-size="10.5">@hbzhong</text><text x="725" y="110" fill="#68746e" font-size="9">我来组成区块的最后一块拼图。</text><line x1="862" y1="82.0" x2="888" y2="82.0" stroke="#b3bcb4" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="888" y="44" width="148" height="76" rx="4" fill="#ffffff" stroke="#d5dbd2" stroke-width="1"/><text x="899" y="65" fill="#8a5f10" font-size="13" font-weight="700">#2612</text><text x="899" y="81" fill="#121916" font-size="10">4bfb44746d246cb9&#8230;</text><text x="899" y="96" fill="#1c5b52" font-size="10.5">@hbzhong</text><text x="899" y="110" fill="#68746e" font-size="9">挖到就是缘分，入链才算名分。</text></svg>
