<text x="18" y="26" fill="#121916" font-size="15" font-weight="700">ROFL</text><text x="72" y="26" fill="#68746e" font-size="12.5">height 2704 &#183; difficulty 2,519 &#183; 2518 puzzles per block</text><rect x="18" y="44" width="148" height="76" rx="4" fill="#ffffff" stroke="#d5dbd2" stroke-width="1"/><text x="29" y="65" fill="#8a5f10" font-size="13" font-weight="700">#2699</text><text x="29" y="81" fill="#121916" font-size="10">dc051ff802f669ea&#8230;</text><text x="29" y="96" fill="#1c5b52" font-size="10.5">@ywltby</text><text x="29" y="110" fill="#68746e" font-size="9">天不生我ZmjjKK，瓦圈万古如长夜。</text><line x1="166" y1="82.0" x2="192" y2="82.0" stroke="#b3bcb4" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="192" y="44" width="148" height="76" rx="4" fill="#ffffff" stroke="#d5dbd2" stroke-width="1"/><text x="203" y="65" fill="#8a5f10" font-size="13" font-weight="700">#2700</text><text x="203" y="81" fill="#121916" font-size="10">390c9e28adfb5d19&#8230;</text><text x="203" y="96" fill="#1c5b52" font-size="10.5">@hbzhong</text><text x="203" y="110" fill="#68746e" font-size="9">散步没有收益曲线，但腿很赞成。</text><line x1="340" y1="82.0" x2="366" y2="82.0" stroke="#b3bcb4" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="366" y="44" width="148" height="76" rx="4" fill="#ffffff" stroke="#d5dbd2" stroke-width="1"/><text x="377" y="65" fill="#8a5f10" font-size="13" font-weight="700">#2701</text><text x="377" y="81" fill="#121916" font-size="10">639cb557e45cab3e&#8230;</text><text x="377" y="96" fill="#1c5b52" font-size="10.5">@hbzhong</text><text x="377" y="110" fill="#68746e" font-size="9">睡个好觉，是明天的启动资金。</text><line x1="514" y1="82.0" x2="540" y2="82.0" stroke="#b3bcb4" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="540" y="44" width="148" height="76" rx="4" fill="#ffffff" stroke="#d5dbd2" stroke-width="1"/><text x="551" y="65" fill="#8a5f10" font-size="13" font-weight="700">#2702</text><text x="551" y="81" fill="#121916" font-size="10">2ad46ab0d499d31d&#8230;</text><text x="551" y="96" fill="#1c5b52" font-size="10.5">@ywltby</text><text x="551" y="110" fill="#68746e" font-size="9">以前说拿了世界冠军就不骂我了，</text><line x1="688" y1="82.0" x2="714" y2="82.0" stroke="#b3bcb4" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="714" y="44" width="148" height="76" rx="4" fill="#ffffff" stroke="#d5dbd2" stroke-width="1"/><text x="725" y="65" fill="#8a5f10" font-size="13" font-weight="700">#2703</text><text x="725" y="81" fill="#121916" font-size="10">247305fda34a7202&#8230;</text><text x="725" y="96" fill="#1c5b52" font-size="10.5">@ywltby</text><text x="725" y="110" fill="#68746e" font-size="9">VCTCN，你们的王回来了！</text><line x1="862" y1="82.0" x2="888" y2="82.0" stroke="#b3bcb4" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="888" y="44" width="148" height="76" rx="4" fill="#ffffff" stroke="#d5dbd2" stroke-width="1"/><text x="899" y="65" fill="#8a5f10" font-size="13" font-weight="700">#2704</text><text x="899" y="81" fill="#121916" font-size="10">a330b95ceb73f870&#8230;</text><text x="899" y="96" fill="#1c5b52" font-size="10.5">@hbzhong</text><text x="899" y="110" fill="#68746e" font-size="9">账户可以复盘，夕阳记得现场看。</text></svg>
