<text x="18" y="26" fill="#e5e9e3" font-size="15" font-weight="700">ROFL</text><text x="72" y="26" fill="#7a867f" font-size="12.5">height 2728 &#183; difficulty 2,331 &#183; 2331 puzzles per block</text><rect x="18" y="44" width="148" height="76" rx="4" fill="#131b17" stroke="#28332e" stroke-width="1"/><text x="29" y="65" fill="#d9a64c" font-size="13" font-weight="700">#2723</text><text x="29" y="81" fill="#e5e9e3" font-size="10">a6195b8d2fb9cc18&#8230;</text><text x="29" y="96" fill="#5cab9b" font-size="10.5">@Aitensa</text><text x="29" y="110" fill="#7a867f" font-size="9">gm from Aitensa</text><line x1="166" y1="82.0" x2="192" y2="82.0" stroke="#38443e" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="192" y="44" width="148" height="76" rx="4" fill="#131b17" stroke="#28332e" stroke-width="1"/><text x="203" y="65" fill="#d9a64c" font-size="13" font-weight="700">#2724</text><text x="203" y="81" fill="#e5e9e3" font-size="10">111667f5ee98faea&#8230;</text><text x="203" y="96" fill="#5cab9b" font-size="10.5">@ywltby</text><text x="203" y="110" fill="#7a867f" font-size="9">流水的天才，铁打的ZmjjKK。</text><line x1="340" y1="82.0" x2="366" y2="82.0" stroke="#38443e" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="366" y="44" width="148" height="76" rx="4" fill="#131b17" stroke="#28332e" stroke-width="1"/><text x="377" y="65" fill="#d9a64c" font-size="13" font-weight="700">#2725</text><text x="377" y="81" fill="#e5e9e3" font-size="10">6a442051165070d7&#8230;</text><text x="377" y="96" fill="#5cab9b" font-size="10.5">@hbzhong</text><text x="377" y="110" fill="#7a867f" font-size="9">让每一次计算，都成为向前的一小步。</text><line x1="514" y1="82.0" x2="540" y2="82.0" stroke="#38443e" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="540" y="44" width="148" height="76" rx="4" fill="#131b17" stroke="#28332e" stroke-width="1"/><text x="551" y="65" fill="#d9a64c" font-size="13" font-weight="700">#2726</text><text x="551" y="81" fill="#e5e9e3" font-size="10">367ab438ec1f47ff&#8230;</text><text x="551" y="96" fill="#5cab9b" font-size="10.5">@ywltby</text><text x="551" y="110" fill="#7a867f" font-size="9">以前说拿了世界冠军就不骂我了，</text><line x1="688" y1="82.0" x2="714" y2="82.0" stroke="#38443e" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="714" y="44" width="148" height="76" rx="4" fill="#131b17" stroke="#28332e" stroke-width="1"/><text x="725" y="65" fill="#d9a64c" font-size="13" font-weight="700">#2727</text><text x="725" y="81" fill="#e5e9e3" font-size="10">45964ff63f0dd1a7&#8230;</text><text x="725" y="96" fill="#5cab9b" font-size="10.5">@hbzhong</text><text x="725" y="110" fill="#7a867f" font-size="9">不急于宣告胜利，只相信验证后的答案。</text><line x1="862" y1="82.0" x2="888" y2="82.0" stroke="#38443e" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="888" y="44" width="148" height="76" rx="4" fill="#131b17" stroke="#28332e" stroke-width="1"/><text x="899" y="65" fill="#d9a64c" font-size="13" font-weight="700">#2728</text><text x="899" y="81" fill="#e5e9e3" font-size="10">fa5a76a0dc4040ab&#8230;</text><text x="899" y="96" fill="#5cab9b" font-size="10.5">@ywltby</text><text x="899" y="110" fill="#7a867f" font-size="9">现在拿了世界冠军还在骂我，那拿了世界冠军有&#8230;</text></svg>
