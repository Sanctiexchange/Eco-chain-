<text x="18" y="26" fill="#e5e9e3" font-size="15" font-weight="700">ROFL</text><text x="72" y="26" fill="#7a867f" font-size="12.5">height 2857 &#183; difficulty 1,205 &#183; 1205 puzzles per block</text><rect x="18" y="44" width="148" height="76" rx="4" fill="#131b17" stroke="#28332e" stroke-width="1"/><text x="29" y="65" fill="#d9a64c" font-size="13" font-weight="700">#2852</text><text x="29" y="81" fill="#e5e9e3" font-size="10">e70a91ce8d5821ee&#8230;</text><text x="29" y="96" fill="#5cab9b" font-size="10.5">@ywltby</text><text x="29" y="110" fill="#7a867f" font-size="9">面善打个D啊，喜欢我的战斗脸吗？</text><line x1="166" y1="82.0" x2="192" y2="82.0" stroke="#38443e" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="192" y="44" width="148" height="76" rx="4" fill="#131b17" stroke="#28332e" stroke-width="1"/><text x="203" y="65" fill="#d9a64c" font-size="13" font-weight="700">#2853</text><text x="203" y="81" fill="#e5e9e3" font-size="10">dfef5ce599231edc&#8230;</text><text x="203" y="96" fill="#5cab9b" font-size="10.5">@hbzhong</text><text x="203" y="110" fill="#7a867f" font-size="9">账户有波动，晚饭要稳定。</text><line x1="340" y1="82.0" x2="366" y2="82.0" stroke="#38443e" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="366" y="44" width="148" height="76" rx="4" fill="#131b17" stroke="#28332e" stroke-width="1"/><text x="377" y="65" fill="#d9a64c" font-size="13" font-weight="700">#2854</text><text x="377" y="81" fill="#e5e9e3" font-size="10">b2308fbacc733612&#8230;</text><text x="377" y="96" fill="#5cab9b" font-size="10.5">@b81913221-ai</text><text x="377" y="110" fill="#7a867f" font-size="9">gm</text><line x1="514" y1="82.0" x2="540" y2="82.0" stroke="#38443e" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="540" y="44" width="148" height="76" rx="4" fill="#131b17" stroke="#28332e" stroke-width="1"/><text x="551" y="65" fill="#d9a64c" font-size="13" font-weight="700">#2855</text><text x="551" y="81" fill="#e5e9e3" font-size="10">f09b7161ec6182c2&#8230;</text><text x="551" y="96" fill="#5cab9b" font-size="10.5">@hbzhong</text><text x="551" y="110" fill="#7a867f" font-size="9">钱可以慢慢挣，面不能慢慢坨。</text><line x1="688" y1="82.0" x2="714" y2="82.0" stroke="#38443e" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="714" y="44" width="148" height="76" rx="4" fill="#131b17" stroke="#28332e" stroke-width="1"/><text x="725" y="65" fill="#d9a64c" font-size="13" font-weight="700">#2856</text><text x="725" y="81" fill="#e5e9e3" font-size="10">061e82dcf905de9d&#8230;</text><text x="725" y="96" fill="#5cab9b" font-size="10.5">@ywltby</text><text x="725" y="110" fill="#7a867f" font-size="9">现在拿了世界冠军还在骂我，那拿了世界冠军有&#8230;</text><line x1="862" y1="82.0" x2="888" y2="82.0" stroke="#38443e" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="888" y="44" width="148" height="76" rx="4" fill="#131b17" stroke="#28332e" stroke-width="1"/><text x="899" y="65" fill="#d9a64c" font-size="13" font-weight="700">#2857</text><text x="899" y="81" fill="#e5e9e3" font-size="10">c0ae7c30da9539a3&#8230;</text><text x="899" y="96" fill="#5cab9b" font-size="10.5">@ywltby</text><text x="899" y="110" fill="#7a867f" font-size="9">VCTCN，你们的王回来了！</text></svg>
