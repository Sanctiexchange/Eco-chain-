<text x="18" y="26" fill="#e5e9e3" font-size="15" font-weight="700">ROFL</text><text x="72" y="26" fill="#7a867f" font-size="12.5">height 2266 &#183; difficulty 3,000 &#183; 3000 puzzles per block</text><rect x="18" y="44" width="148" height="76" rx="4" fill="#131b17" stroke="#28332e" stroke-width="1"/><text x="29" y="65" fill="#d9a64c" font-size="13" font-weight="700">#2261</text><text x="29" y="81" fill="#e5e9e3" font-size="10">39b0cc29a699f12d&#8230;</text><text x="29" y="96" fill="#5cab9b" font-size="10.5">@ywltby</text><text x="29" y="110" fill="#7a867f" font-size="9">都是同龄人，我原本没想降维打击。</text><line x1="166" y1="82.0" x2="192" y2="82.0" stroke="#38443e" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="192" y="44" width="148" height="76" rx="4" fill="#131b17" stroke="#28332e" stroke-width="1"/><text x="203" y="65" fill="#d9a64c" font-size="13" font-weight="700">#2262</text><text x="203" y="81" fill="#e5e9e3" font-size="10">de0928ee3a3fb24c&#8230;</text><text x="203" y="96" fill="#5cab9b" font-size="10.5">@ywltby</text><text x="203" y="110" fill="#7a867f" font-size="9">康神开播了？</text><line x1="340" y1="82.0" x2="366" y2="82.0" stroke="#38443e" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="366" y="44" width="148" height="76" rx="4" fill="#131b17" stroke="#28332e" stroke-width="1"/><text x="377" y="65" fill="#d9a64c" font-size="13" font-weight="700">#2263</text><text x="377" y="81" fill="#e5e9e3" font-size="10">761611b608623642&#8230;</text><text x="377" y="96" fill="#5cab9b" font-size="10.5">@ywltby</text><text x="377" y="110" fill="#7a867f" font-size="9">不要小瞧EDG所有人的羁绊啊。</text><line x1="514" y1="82.0" x2="540" y2="82.0" stroke="#38443e" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="540" y="44" width="148" height="76" rx="4" fill="#131b17" stroke="#28332e" stroke-width="1"/><text x="551" y="65" fill="#d9a64c" font-size="13" font-weight="700">#2264</text><text x="551" y="81" fill="#e5e9e3" font-size="10">2337b6714fafe262&#8230;</text><text x="551" y="96" fill="#5cab9b" font-size="10.5">@ywltby</text><text x="551" y="110" fill="#7a867f" font-size="9">现在拿了世界冠军还在骂我，那拿了世界冠军有&#8230;</text><line x1="688" y1="82.0" x2="714" y2="82.0" stroke="#38443e" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="714" y="44" width="148" height="76" rx="4" fill="#131b17" stroke="#28332e" stroke-width="1"/><text x="725" y="65" fill="#d9a64c" font-size="13" font-weight="700">#2265</text><text x="725" y="81" fill="#e5e9e3" font-size="10">1aeb8bd5b0999da1&#8230;</text><text x="725" y="96" fill="#5cab9b" font-size="10.5">@ywltby</text><text x="725" y="110" fill="#7a867f" font-size="9">以前说拿了世界冠军就不骂我了，</text><line x1="862" y1="82.0" x2="888" y2="82.0" stroke="#38443e" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="888" y="44" width="148" height="76" rx="4" fill="#131b17" stroke="#28332e" stroke-width="1"/><text x="899" y="65" fill="#d9a64c" font-size="13" font-weight="700">#2266</text><text x="899" y="81" fill="#e5e9e3" font-size="10">014b0fbcafd6142e&#8230;</text><text x="899" y="96" fill="#5cab9b" font-size="10.5">@ywltby</text><text x="899" y="110" fill="#7a867f" font-size="9">原神？启动！</text></svg>
