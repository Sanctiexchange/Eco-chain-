<text x="18" y="26" fill="#e5e9e3" font-size="15" font-weight="700">ROFL</text><text x="72" y="26" fill="#7a867f" font-size="12.5">height 2546 &#183; difficulty 3,000 &#183; 3000 puzzles per block</text><rect x="18" y="44" width="148" height="76" rx="4" fill="#131b17" stroke="#28332e" stroke-width="1"/><text x="29" y="65" fill="#d9a64c" font-size="13" font-weight="700">#2541</text><text x="29" y="81" fill="#e5e9e3" font-size="10">d5bcf3b472acc984&#8230;</text><text x="29" y="96" fill="#5cab9b" font-size="10.5">@ywltby</text><text x="29" y="110" fill="#7a867f" font-size="9">以前说拿了世界冠军就不骂我了，</text><line x1="166" y1="82.0" x2="192" y2="82.0" stroke="#38443e" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="192" y="44" width="148" height="76" rx="4" fill="#131b17" stroke="#28332e" stroke-width="1"/><text x="203" y="65" fill="#d9a64c" font-size="13" font-weight="700">#2542</text><text x="203" y="81" fill="#e5e9e3" font-size="10">5145afc8f8ed4b8b&#8230;</text><text x="203" y="96" fill="#5cab9b" font-size="10.5">@hbzhong</text><text x="203" y="110" fill="#7a867f" font-size="9">别把所有耐心，都留给加载圆圈。</text><line x1="340" y1="82.0" x2="366" y2="82.0" stroke="#38443e" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="366" y="44" width="148" height="76" rx="4" fill="#131b17" stroke="#28332e" stroke-width="1"/><text x="377" y="65" fill="#d9a64c" font-size="13" font-weight="700">#2543</text><text x="377" y="81" fill="#e5e9e3" font-size="10">58b173a7b2a0abde&#8230;</text><text x="377" y="96" fill="#5cab9b" font-size="10.5">@ywltby</text><text x="377" y="110" fill="#7a867f" font-size="9">不要小瞧EDG所有人的羁绊啊。</text><line x1="514" y1="82.0" x2="540" y2="82.0" stroke="#38443e" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="540" y="44" width="148" height="76" rx="4" fill="#131b17" stroke="#28332e" stroke-width="1"/><text x="551" y="65" fill="#d9a64c" font-size="13" font-weight="700">#2544</text><text x="551" y="81" fill="#e5e9e3" font-size="10">f998ba50423f569e&#8230;</text><text x="551" y="96" fill="#5cab9b" font-size="10.5">@ywltby</text><text x="551" y="110" fill="#7a867f" font-size="9">现在拿了世界冠军还在骂我，那拿了世界冠军有&#8230;</text><line x1="688" y1="82.0" x2="714" y2="82.0" stroke="#38443e" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="714" y="44" width="148" height="76" rx="4" fill="#131b17" stroke="#28332e" stroke-width="1"/><text x="725" y="65" fill="#d9a64c" font-size="13" font-weight="700">#2545</text><text x="725" y="81" fill="#e5e9e3" font-size="10">c95d8dfe963500f8&#8230;</text><text x="725" y="96" fill="#5cab9b" font-size="10.5">@hbzhong</text><text x="725" y="110" fill="#7a867f" font-size="9">人生偶尔空仓，冰箱不能空仓。</text><line x1="862" y1="82.0" x2="888" y2="82.0" stroke="#38443e" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="888" y="44" width="148" height="76" rx="4" fill="#131b17" stroke="#28332e" stroke-width="1"/><text x="899" y="65" fill="#d9a64c" font-size="13" font-weight="700">#2546</text><text x="899" y="81" fill="#e5e9e3" font-size="10">c9e2ca2eb48165d4&#8230;</text><text x="899" y="96" fill="#5cab9b" font-size="10.5">@hbzhong</text><text x="899" y="110" fill="#7a867f" font-size="9">风口没赶上，晚风可以多吹会儿。</text></svg>
