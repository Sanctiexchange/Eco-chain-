<text x="18" y="26" fill="#e5e9e3" font-size="15" font-weight="700">ROFL</text><text x="72" y="26" fill="#7a867f" font-size="12.5">height 2841 &#183; difficulty 1,370 &#183; 1369 puzzles per block</text><rect x="18" y="44" width="148" height="76" rx="4" fill="#131b17" stroke="#28332e" stroke-width="1"/><text x="29" y="65" fill="#d9a64c" font-size="13" font-weight="700">#2836</text><text x="29" y="81" fill="#e5e9e3" font-size="10">a03929127142164f&#8230;</text><text x="29" y="96" fill="#5cab9b" font-size="10.5">@ywltby</text><text x="29" y="110" fill="#7a867f" font-size="9">康神开播了？</text><line x1="166" y1="82.0" x2="192" y2="82.0" stroke="#38443e" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="192" y="44" width="148" height="76" rx="4" fill="#131b17" stroke="#28332e" stroke-width="1"/><text x="203" y="65" fill="#d9a64c" font-size="13" font-weight="700">#2837</text><text x="203" y="81" fill="#e5e9e3" font-size="10">d950aaa097cbad0f&#8230;</text><text x="203" y="96" fill="#5cab9b" font-size="10.5">@hbzhong</text><text x="203" y="110" fill="#7a867f" font-size="9">不必赚每一分钱，还得留时间花。</text><line x1="340" y1="82.0" x2="366" y2="82.0" stroke="#38443e" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="366" y="44" width="148" height="76" rx="4" fill="#131b17" stroke="#28332e" stroke-width="1"/><text x="377" y="65" fill="#d9a64c" font-size="13" font-weight="700">#2838</text><text x="377" y="81" fill="#e5e9e3" font-size="10">750460b143ee108c&#8230;</text><text x="377" y="96" fill="#5cab9b" font-size="10.5">@ywltby</text><text x="377" y="110" fill="#7a867f" font-size="9">不要小瞧EDG所有人的羁绊啊。</text><line x1="514" y1="82.0" x2="540" y2="82.0" stroke="#38443e" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="540" y="44" width="148" height="76" rx="4" fill="#131b17" stroke="#28332e" stroke-width="1"/><text x="551" y="65" fill="#d9a64c" font-size="13" font-weight="700">#2839</text><text x="551" y="81" fill="#e5e9e3" font-size="10">b48454583f1f7d8e&#8230;</text><text x="551" y="96" fill="#5cab9b" font-size="10.5">@hbzhong</text><text x="551" y="110" fill="#7a867f" font-size="9">今天最大的操作：把手放回口袋。</text><line x1="688" y1="82.0" x2="714" y2="82.0" stroke="#38443e" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="714" y="44" width="148" height="76" rx="4" fill="#131b17" stroke="#28332e" stroke-width="1"/><text x="725" y="65" fill="#d9a64c" font-size="13" font-weight="700">#2840</text><text x="725" y="81" fill="#e5e9e3" font-size="10">1f39290df742b55b&#8230;</text><text x="725" y="96" fill="#5cab9b" font-size="10.5">@ywltby</text><text x="725" y="110" fill="#7a867f" font-size="9">现在拿了世界冠军还在骂我，那拿了世界冠军有&#8230;</text><line x1="862" y1="82.0" x2="888" y2="82.0" stroke="#38443e" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="888" y="44" width="148" height="76" rx="4" fill="#131b17" stroke="#28332e" stroke-width="1"/><text x="899" y="65" fill="#d9a64c" font-size="13" font-weight="700">#2841</text><text x="899" y="81" fill="#e5e9e3" font-size="10">df578956907449c9&#8230;</text><text x="899" y="96" fill="#5cab9b" font-size="10.5">@hbzhong</text><text x="899" y="110" fill="#7a867f" font-size="9">等待太无聊？给绿萝浇点水。</text></svg>
